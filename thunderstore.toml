[config]
schemaVersion = "0.0.1"


[package]
namespace = "adamant"
name = "ModpackLib"
versionNumber = "3.0.0"
description = "Shared utilities for adamant modpack standalone mods."
websiteUrl = "https://github.com/h2-modpack/adamant-ModpackLib"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.78"
LuaENVY-ENVY = "1.2.0"


[build]
icon = "./icon.png"
readme = "./THUNDERSTORE_README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"

# Uncomment (remove the #) the three lines below if you have any files to copy to the plugins_data folder (like custom .pkg files)
# [[build.copy]]
# source = "./data"
# target = "./plugins_data"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = ["modpacks"]
